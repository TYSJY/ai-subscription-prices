name: 功能问题
description: 报告可复现的界面、解析或部署问题
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 实际结果与预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: 浏览器、操作系统、在线站点或本地版本
  - type: textarea
    id: logs
    attributes:
      label: 已去除个人信息的截图或错误信息
      description: 不要提供密钥、认证信息或数据库导出。
